name: Build and publish Flutter APK

on:
  push:
    tags:
      - "v*"
      - "AniVexa*"
      - "AniVexa v*"

permissions:
  contents: write

concurrency:
  group: apk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Build Flutter APK
        run: |
          set -euo pipefail

          TARGET_DIR="."
          if [ -d "frontend-flutter" ]; then
            TARGET_DIR="frontend-flutter"
          fi
          echo "Building Flutter project in: $TARGET_DIR"

          cd "$TARGET_DIR"

          if [ ! -d "android" ]; then
            echo "Initializing Android platform configuration for Flutter..."
            flutter create . --platforms=android --org com.aistudio.anivexa
          fi

          flutter pub get
          flutter build apk --release
          cd -

      - name: Prepare release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          APK=$(find . -path "*/flutter-apk/*" -name "*release*.apk" -o -path "*/outputs/apk/*" -name "*release*.apk" | head -n 1)
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "Error: No release APK found!"
            exit 1
          fi
          echo "Found generated APK: $APK"

          test -s "release-notes.md" || {
            echo "The release-notes.md file is missing or empty."
            exit 1
          }

          CLEAN_TAG=$(echo "$RELEASE_TAG" | tr -s ' ' '_')
          cp "$APK" "AniVexa-${CLEAN_TAG}.apk"
          sha256sum "AniVexa-${CLEAN_TAG}.apk" > "AniVexa-${CLEAN_TAG}.apk.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            AniVexa-*.apk
            AniVexa-*.apk.sha256