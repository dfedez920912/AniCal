name: Build and publish Flutter APK

on:
  push:
    tags:
      - "v*"
      - "AniVexa*"
      - "AniVexa v*"

permissions:
  contents: write

concurrency:
  group: apk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Build Flutter APK
        run: |
          set -euo pipefail

          TARGET_DIR="."
          if [ -d "frontend-flutter" ]; then
            TARGET_DIR="frontend-flutter"
          fi
          echo "Building Flutter project in: $TARGET_DIR"

          cd "$TARGET_DIR"

          # Clean any stale/partial android directory and generate pristine Flutter project
          rm -rf android
          echo "Generating modern Android platform configuration (v2 embedding)..."
          flutter create . --platforms=android --org com.aistudio.anivexa --project-name anivexa

          # Configure minSdkVersion to 24 (matching minSdk in app/build.gradle.kts)
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 24/' android/app/build.gradle 2>/dev/null || true
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts 2>/dev/null || true
          fi

          # Ensure AniVexa custom launcher icons are applied in all densities
          echo "Applying AniVexa launcher icons..."
          mkdir -p android/app/src/main/res
          if [ -d "../app/src/main/res" ]; then
            cp -r ../app/src/main/res/mipmap* android/app/src/main/res/
            cp -r ../app/src/main/res/drawable android/app/src/main/res/
          fi

          # Ensure INTERNET permission and cleartext traffic are present in AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
              sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>' "$MANIFEST"
            fi
            if ! grep -q "usesCleartextTraffic" "$MANIFEST"; then
              sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
            fi
            sed -i 's/android:icon="@mipmap\/[a-zA-Z0-9_]*"/android:icon="@mipmap\/ic_launcher" android:roundIcon="@mipmap\/ic_launcher_round"/' "$MANIFEST" || true
          fi

          flutter pub get
          flutter build apk --release
          cd -

      - name: Prepare release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          APK=$(find . -path "*/flutter-apk/*" -name "*release*.apk" -o -path "*/outputs/apk/*" -name "*release*.apk" | head -n 1)
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "Error: No release APK found!"
            exit 1
          fi
          echo "Found generated APK: $APK"

          test -s "release-notes.md" || {
            echo "The release-notes.md file is missing or empty."
            exit 1
          }

          CLEAN_TAG=$(echo "$RELEASE_TAG" | tr -s ' ' '_')
          cp "$APK" "AniVexa-${CLEAN_TAG}.apk"
          sha256sum "AniVexa-${CLEAN_TAG}.apk" > "AniVexa-${CLEAN_TAG}.apk.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            AniVexa-*.apk
            AniVexa-*.apk.sha256