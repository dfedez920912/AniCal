name: Build and publish APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: apk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Required secret ANDROID_KEYSTORE_BASE64 is not configured."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Run unit tests and build signed release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$STORE_PASSWORD" || { echo "Required secret STORE_PASSWORD is not configured."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Required secret KEY_PASSWORD is not configured."; exit 1; }
          bash ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Prepare release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          test -s "release-notes.md" || {
            echo "The root-level release-notes.md file is missing or empty."
            exit 1
          }

          cp "$APK" "AniVexa-${RELEASE_TAG}.apk"
          sha256sum "AniVexa-${RELEASE_TAG}.apk" > "AniVexa-${RELEASE_TAG}.apk.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AniVexa ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            AniVexa-${{ github.ref_name }}.apk
            AniVexa-${{ github.ref_name }}.apk.sha256